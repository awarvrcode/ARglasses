<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR: Nose Bridge Tracker</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { display: none; } /* 隱藏原始影片，由 Three.js 處理 */
        canvas { position: absolute; top: 0; left: 0; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<div id="loading">正在載入 AI 模型...</div>
<div id="video-container">
    <video id="webcam" autoplay playsinline></video>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById('webcam');
    const loadingDiv = document.getElementById('loading');
    let faceLandmarker;
    let lastVideoTime = -1;

    // Three.js 變數
    let scene, camera, renderer, box;
    let videoTexture, videoMesh;

    async function init() {
        // 1. 初始化 MediaPipe Face Landmarker
        const filesetResolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                delegate: "GPU"
            },
            outputFaceBlendshapes: true,
            runningMode: "VIDEO",
            numFaces: 1
        });

        // 2. 啟動攝影機
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 1280, height: 720 }, 
            audio: false 
        });
        video.srcObject = stream;
        video.addEventListener('loadeddata', setupThreeJS);
    }

    function setupThreeJS() {
        // 3. 初始化 Three.js 場景
        scene = new THREE.Scene();
        
        const aspect = video.videoWidth / video.videoHeight;
        camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('video-container').appendChild(renderer.domElement);

        // 建立背景影片 Plane
        videoTexture = new THREE.VideoTexture(video);
        const geometry = new THREE.PlaneGeometry(aspect * 7.5, 7.5); // 根據距離調整比例
        const material = new THREE.MeshBasicMaterial({ map: videoTexture });
        videoMesh = new THREE.Mesh(geometry, material);
        videoMesh.position.z = -2; // 放在背景
        scene.add(videoMesh);

        // 建立鼻樑上的小方塊
        const boxGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const boxMat = new THREE.MeshNormalMaterial(); // 使用法線材質，方便觀察旋轉
        box = new THREE.Mesh(boxGeo, boxMat);
        scene.add(box);

        loadingDiv.style.display = 'none';
        render();
    }

    function render() {
        if (video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];

                // 點 6 是鼻樑 (Bridge of the nose)
                const noseBridge = landmarks[6];
                
                // 座標轉換 (MediaPipe 0~1 轉為 Three.js 世界座標)
                // 我們假設 Plane 高度為 7.5，寬度為 7.5 * aspect
                const aspect = video.videoWidth / video.videoHeight;
                const x = (noseBridge.x - 0.5) * (aspect * 7.5);
                const y = -(noseBridge.y - 0.5) * 7.5;
                const z = -noseBridge.z * 5; // Z 軸縮放視感

                box.position.set(x, y, z);

                // 計算旋轉 (簡單版：利用鼻尖與額頭計算 Up Vector)
                // 點 1 (鼻尖), 點 10 (額頭), 點 152 (下巴)
                const top = landmarks[10];
                const bottom = landmarks[152];
                const left = landmarks[234]; // 左耳側
                const right = landmarks[454]; // 右耳側

                // 簡單的角度估算
                box.rotation.z = Math.atan2(right.y - left.y, right.x - left.x);
                box.rotation.y = (noseBridge.x - 0.5) * 2; // 左右轉動補償
                box.rotation.x = (noseBridge.y - 0.5) * 2; // 上下轉動補償
            }
        }

        renderer.render(scene, camera);
        requestAnimationFrame(render);
    }

    window.addEventListener('resize', () => {
        if (!camera) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
