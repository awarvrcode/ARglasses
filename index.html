<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebAR Sunglasses Try-On (Fixed Movement)</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    
    /* 影片鏡像顯示（符合使用者照鏡子習慣） */
    video { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; transform: scaleX(-1); 
    }
    
    /* 畫布不使用 CSS 鏡像，座標邏輯在 JS 處理 */
    #output { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; background: rgba(0,0,0,0.8); padding: 20px 30px; border-radius: 12px; z-index: 1000;
    }

    .controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 100;
    }
    button {
      padding: 10px 16px; background: white; border: none; border-radius: 20px;
      cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.active { background: #4CAF50; color: white; }

    .debug-info {
      position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
      color: #0f0; padding: 10px; border-radius: 8px; font-size: 11px;
      pointer-events: none; font-family: monospace; line-height: 1.4;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="container">
    <div class="loading" id="loading">初始化相機與模型中...</div>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="output"></canvas>

    <div class="controls">
      <button id="toggleModel" class="active">顯示眼鏡</button>
      <button id="toggleDebug">偵錯資訊</button>
    </div>

    <div class="debug-info" id="debugInfo" style="display: none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

    // --- 參數調整區 ---
    const ANCHOR_UP_OFFSET = -0.015; // 眼鏡垂直位置微調
    const SCALE_K = 0.007;           // 眼鏡隨臉部大小縮放的係數
    const DEPTH_K = 60;              // 距離計算係數（影響前後位移量）
    const DEPTH_B = 0.15;            // 最小深度距離
    
    // --- 變數定義 ---
    const video = document.getElementById("video");
    const canvas = document.getElementById("output");
    const loading = document.getElementById("loading");
    const debugInfo = document.getElementById("debugInfo");

    let scene, camera, renderer, glassesRoot, glassesReady = false;
    let showModel = true, showDebug = false;

    // --- 平滑化工具 ---
    class SmoothValue {
      constructor(f = 0.3) { this.f = f; this.v = null; }
      update(next) {
        if (this.v === null) return this.v = next;
        if (Array.isArray(next)) {
          this.v = next.map((n, i) => this.v[i] + (n - this.v[i]) * this.f);
        } else {
          this.v = this.v + (next - this.v) * this.f;
        }
        return this.v;
      }
    }
    const smoothPos = new SmoothValue(0.4);
    const smoothRot = new SmoothValue(0.4);
    const smoothScale = new SmoothValue(0.3);

    // --- 初始化 Three.js ---
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(63, window.innerWidth / window.innerHeight, 0.01, 100);
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const sun = new THREE.DirectionalLight(0xffffff, 0.8);
      sun.position.set(0, 1, 1);
      scene.add(sun);

      glassesRoot = new THREE.Group();
      scene.add(glassesRoot);
    }

    // --- 載入 GLB 模型 ---
    async function loadModel() {
      const loader = new GLTFLoader();
      try {
        // 請確保此路徑正確，或換成你的模型網址
        const gltf = await loader.loadAsync("models/sunglasses_classic.glb");
        const model = gltf.scene;
        
        // 置中模型
        const box = new THREE.Box3().setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);
        model.position.sub(center);
        
        glassesRoot.add(model);
        glassesReady = true;
        console.log("Model Loaded");
      } catch (e) {
        console.error("Model load failed:", e);
      }
    }

    // --- 座標轉換邏輯 ---
    function getNDC(lx, ly, videoW, videoH, screenW, screenH) {
      // 補償 object-fit: cover 造成的位移
      const screenAspect = screenW / screenH;
      const videoAspect = videoW / videoH;
      let drawW, drawH, offsetX = 0, offsetY = 0;

      if (videoAspect > screenAspect) {
        drawH = screenH; drawW = screenH * videoAspect;
        offsetX = (screenW - drawW) / 2;
      } else {
        drawW = screenW; drawH = screenW / videoAspect;
        offsetY = (screenH - drawH) / 2;
      }

      // 計算像素位置
      const px = lx * drawW + offsetX;
      const py = ly * drawH + offsetY;

      // 轉為 NDC
      return {
        x: (px / screenW) * 2 - 1,
        y: -((py / screenH) * 2 - 1),
        px, py
      };
    }

    // --- FaceMesh 回傳結果 ---
    function onResults(results) {
      if (loading.style.display !== "none") loading.style.display = "none";

      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        glassesRoot.visible = false;
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      const videoW = video.videoWidth || 1280;
      const videoH = video.videoHeight || 720;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;

      // 【關鍵修正】：對 X 座標做鏡像翻轉 (1 - x)
      const getPt = (idx) => ({ x: 1 - landmarks[idx].x, y: landmarks[idx].y });

      const nose = getPt(1);
      const leftEye = getPt(33);
      const rightEye = getPt(263);

      // 1. 計算中心點與 NDC
      const midX = (leftEye.x + rightEye.x) / 2;
      const midY = (leftEye.y + rightEye.y) / 2 + ANCHOR_UP_OFFSET;
      const ndc = getNDC(midX, midY, videoW, videoH, screenW, screenH);

      // 2. 計算旋轉
      const lPx = getNDC(leftEye.x, leftEye.y, videoW, videoH, screenW, screenH);
      const rPx = getNDC(rightEye.x, rightEye.y, videoW, videoH, screenW, screenH);
      const nPx = getNDC(nose.x, nose.y, videoW, videoH, screenW, screenH);

      const eyeDistPx = Math.hypot(rPx.px - lPx.px, rPx.py - lPx.py);
      const roll = Math.atan2(rPx.py - lPx.py, rPx.px - lPx.px);
      const yaw = Math.atan2(nPx.px - (lPx.px + rPx.px)/2, eyeDistPx) * 1.5;
      const pitch = Math.atan2(nPx.py - (lPx.py + rPx.py)/2, eyeDistPx) * 1.2;

      // 3. 計算深度與 3D 空間座標
      let depth = (DEPTH_K / Math.max(1, eyeDistPx)) + DEPTH_B;
      const fovRad = camera.fov * Math.PI / 180;
      const worldH = 2 * Math.tan(fovRad / 2) * depth;
      const worldW = worldH * camera.aspect;

      const targetX = ndc.x * (worldW / 2);
      const targetY = ndc.y * (worldH / 2);
      const targetZ = -depth;

      // 4. 套用平滑化並更新模型
      if (glassesReady) {
        const sP = smoothPos.update([targetX, targetY, targetZ]);
        const sR = smoothRot.update([pitch, yaw, -roll]);
        const sS = smoothScale.update(eyeDistPx * SCALE_K);

        glassesRoot.visible = showModel;
        glassesRoot.position.set(sP[0], sP[1], sP[2]);
        glassesRoot.rotation.set(sR[0], sR[1], sR[2]);
        glassesRoot.scale.set(sS, sS, sS);
      }

      if (showDebug) {
        debugInfo.innerHTML = `
          NDC X: ${ndc.x.toFixed(3)} Y: ${ndc.y.toFixed(3)}<br>
          World Pos: ${targetX.toFixed(2)}, ${targetY.toFixed(2)}, ${targetZ.toFixed(2)}<br>
          Eye Dist Px: ${eyeDistPx.toFixed(1)}<br>
          Scale: ${glassesRoot.scale.x.toFixed(3)}
        `;
      }

      renderer.render(scene, camera);
    }

    // --- 啟動程序 ---
    async function init() {
      initThree();
      await loadModel();

      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({
        maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
      });
      faceMesh.onResults(onResults);

      const cam = new Camera(video, {
        onFrame: async () => { await faceMesh.send({ image: video }); },
        width: 1280, height: 720
      });
      cam.start();
    }

    // UI 事件
    document.getElementById("toggleModel").onclick = (e) => {
      showModel = !showModel;
      e.target.classList.toggle("active");
    };
    document.getElementById("toggleDebug").onclick = (e) => {
      showDebug = !showDebug;
      debugInfo.style.display = showDebug ? "block" : "none";
      e.target.classList.toggle("active");
    };
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
